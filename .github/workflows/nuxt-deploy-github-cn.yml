# Nuxt 部署 GitHub Pages

# .github/workflows/nuxt-deploy-github-cn.yml
name: nuxt-deploy-github-cn

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      # 重点：使用 github_pages 预设进行构建
      # - run: npx nuxt build --preset github_pages
      - run: npm run build --yes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
          
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
